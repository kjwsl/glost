[workspace]
resolver = "3"

[package]
name = "glost"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
epub = "2.1"
pdf-extract = "0.10.0"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
url = "2.5"
anyhow = "1.0"
aho-corasick = "1.1.4"
unicode-segmentation = "1.13.2"
scraper = "0.26.0"
ratatui = "0.30"
crossterm = "0.29"
genanki-rs = "0.4.0"
tts = "0.26"
indicatif = "0.18"
rusqlite = { version = "0.25", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.10"
